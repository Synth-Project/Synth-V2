name: Black Autoformat

on:
  [push, pull_request, workflow_dispatch]

permissions: 'write-all'

jobs:
  black_check_and_format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install black
        run: pip install black

      - name: Run black --check
        id: black_check
        run: |
          black --check .
        continue-on-error: true

      - name: Determine if formatting is needed
        id: format_needed
        run: echo "need_formatting=$([[ '${{ steps.black_check.outcome }}' == 'failure' ]] && echo true || echo false)" >> $GITHUB_ENV

      - name: Autoformat code with black if necessary
        if: env.need_formatting == 'true'
        run: |
          black .
          git add .
          git commit -m "Autoformat code using black"
          git push origin HEAD:${{ github.head_ref }}

      - name: Create or Update Pull Request
        if: env.need_formatting == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Замените на PAT_TOKEN, если требуется
          commit-message: "Autoformat code using black"
          branch: "autoformat/${{ github.head_ref }}"
          title: "Autoformat code using black"
          body: "This PR auto-formats the code using black."
          labels: "autoformat"
          branch-suffix: timestamp
