name: Black Autoformat

on:
  [push, pull_request, workflow_dispatch]

permissions: 'write-all'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install black
        run: pip install black

      - name: Run black --check
        id: black_check
        run: |
          black --check .
        continue-on-error: true

      - name: Check if formatting is needed
        id: check_formatting
        run: |
          if [ ${{ steps.black_check.outcome }} == 'failure' ]; then
            echo "Formatting needed."
            echo "need_formatting=true" >> $GITHUB_ENV
          else
            echo "No formatting needed."
            echo "need_formatting=false" >> $GITHUB_ENV
          fi

      - name: Autoformat code with black
        if: env.need_formatting == 'true'
        run: |
          black .
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Black Autoformat bot"

          commit_id=$(git log -1 --pretty=format:"%H")

          git add .
          git commit -m "Autoformat code using black
            
          This commit reformats the codebase using Black.
            
          Affected commit ID: $commit_id"
          git push origin ${{github.ref_name}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: env.need_formatting == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Autoformat code using black"
          body: |
            This PR auto-formats the code using black. Please review and merge the changes.
          branch: "autoformat-${{ github.run_id }}"
          base: ${{ github.ref_name }}
          labels: "autoformat"