name: Black Autoformat

on:
  [push, pull_request, workflow_dispatch]

permissions: 'write-all'

jobs:
  black_check_and_format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install black
        run: pip install black

      - name: Run black --check
        id: black_check
        run: |
          black --check .
        continue-on-error: true

      - name: Check if formatting is needed
        id: check_formatting
        run: |
          if [ ${{ steps.black_check.outcome }} == 'failure' ]; then
            echo "Formatting needed."
            echo "need_formatting=true" >> $GITHUB_ENV
          else
            echo "No formatting needed."
            echo "need_formatting=false" >> $GITHUB_ENV
          fi

      - name: Autoformat code with black
        if: env.need_formatting == 'true'
        run: |
          black .
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          branch_name="autoformat-${{ github.run_id }}"
          git checkout -b "$branch_name"
          git add .
          git commit -m "Autoformat code using black"
          git push origin "$branch_name"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        # if: env.need_formatting == 'true'
        # uses: peter-evans/create-pull-request@v5
        # with:
        #   token: ${{ secrets.GITHUB_TOKEN }}
        #   commit-message: "Autoformat code using black"
        #   branch: "autoformat-${{ github.run_id }}"
        #   base: "main"
        #   title: "Autoformat code using black"
        #   body: "This PR auto-formats the code using black."
        #   labels: "autoformat"
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT }}
          commit-message: Update report
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: example-patches
          delete-branch: true
          title: '[Example] Update report'
          body: |
            Update report
            - Updated with *today's* date
            - Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: |
            report
            automated pr
          assignees: peter-evans
          reviewers: peter-evans
          team-reviewers: |
            developers
            qa-team
          milestone: 1
          draft: false
