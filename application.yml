lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.3.0"
      repository: "https://maven.topi.wtf/releases"
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.1"
    # - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.0.0"
      # snapshot: false # Set to true if you want to use a snapshot version.
    - dependency: "dev.schlaubi.lyrics:lavalink:2.5.0"
  server:
    password: "weever_gay"
    sources:
      youtube: false
      spotify: true
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      mixer: false
      http: true
      local: false
    bufferDurationMs: 400 # The duration of the NAS buffer. Higher values fare better against longer GC pauses. Minimum of 40ms, lower values may introduce pauses.
    frameBufferDurationMs: 5000 # How many milliseconds of audio to keep buffered
    opusEncodingQuality: 0 # Opus encoder quality. Valid values range from 0 to 10, where 10 is the best quality but is the most expensive on the CPU.
    resamplingQuality: LOW # Quality of resampling operations. Valid values are LOW, MEDIUM and HIGH, where HIGH uses the most CPU.
    trackStuckThresholdMs: 10000 # The threshold for how long a track can be stuck. A track is stuck if it does not return any audio data.
    useSeekGhosting: true # Seek ghosting is the effect where whilst a seek is in progress, the audio buffer is read from until empty, or until seek is ready.
    youtubePlaylistLoadLimit: 6 # Number of pages at 100 each
    playerUpdateInterval: 5 # How frequently to send player updates to clients, in seconds
    youtubeSearchEnabled: false
    spotifySearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true


plugins:
  #  lavalyrics:
  #    sources:
  #      - spotify
  #      - youtube
  #      - deezer
  #      - yandexMusic

  lavasrc:
    #    providers: # Custom providers for track loading. This is the default
    #      - "ytsearch:%QUERY%" # YouTube search provider
    #      - "ytsearch:\"%ISRC%\"" # YouTube search provider
    #      - "spsearch:%QUERY%" # Spotify search provider
    #      - "sprec:%QUERY%" # Spotify recommendation search provider
    sources:
      spotify: true # Enable Spotify source
      applemusic: false # Enable Apple Music source
      deezer: false # Enable Deezer source
      yandexmusic: false # Enable Yandex Music source
      flowerytts: false # Enable Flowery TTs source
      youtube: false # Enable YouTube search source (https://github.com/topi314/LavaSearch)
    spotify:
      clientId: "e64edaa83b1441219e0bfc9e63c0acda" #Enter client id here
      clientSecret: "8ad9bb4d28e645fe8f66485cb2175771" #Enter client secret here
      countryCode: "US" # the country code you want to use for filtering the artists top tracks. See https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
      playlistLoadLimit: 6 # The number of pages at 100 tracks each
      albumLoadLimit: 6 # The number of pages at 50 tracks each
  youtube:
    enabled: true
    # allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      # - MUSIC
      # - ANDROID_TESTSUITE
      - WEB
      # - ANDROID
      # - ANDROID_MUSIC
      - TVHTML5EMBEDDED

server: # REST and WS server
  port: 2333
  address: 0.0.0.0

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    max-history: 30
    max-size: 1GB
  path: ./logs/

  level:
    root: INFO
    lavalink: INFO

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000